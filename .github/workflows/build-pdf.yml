name: Build PDF

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install --quiet "pymupdf>=1.24,<2" "segno>=1.6" "pillow>=10"

      - name: Build — designed HTML -> Chrome headless -> PyMuPDF
        run: python3 build.py guide-v2.html guide-v2-ar.pdf

      - name: Gate — verify against the Gold Standard checklist
        run: python3 scripts/verify_pdf.py guide-v2-ar.pdf 12 42

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: guide-v2-pdf
          path: guide-v2-ar.pdf
          if-no-files-found: error

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" guide-v2-ar.pdf --generate-notes
