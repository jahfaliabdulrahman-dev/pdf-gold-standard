name: Build PDF

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Building needs to read the repository, nothing more; only the release job may write (and only on a version tag).
permissions:
  contents: read

jobs:
  build:
    # macOS: same system faces as the owner's Mac (GeezaPro for the vocalised basmala) and Chrome preinstalled
    runs-on: macos-15
    env:
      # ONE value in this file: the action input below and chrome_pin.py are compared against it, and the gate
      # refuses a manifest that names anything else.
      CHROME_VERSION: "157.0.8103.78"
      # The baselines' rule sets are identical on the 1.30.0 CLI string and the 1.30.4 distribution (measured
      # 2026-11-24); the installer below is pinned by SHA-256, not by what brew ships today.
      VERAPDF_VERSION: "1.30.4"
      VERAPDF_INSTALLER_SHA256: "04415ef3f149526a3048b9889723e81320ddf013bd891bcc7f0f297f3eadcc23"
      # poppler is pinned to an exact conda-forge build, not to whatever brew has today: a reader's floors are
      # recorded per version, so an unpinned source turns every upstream bump into a red main. The version below
      # is the one whose floors the ratchet holds, and the step refuses any other by name.
      POPPLER_VERSION: "26.11.0"
    steps:
      - uses: actions/checkout@v5

      - name: One cache root for the run (the checker reads stored controls)
        run: echo "ARABIC_PDF_CHECK_CACHE=$RUNNER_TEMP/arabic-pdf-check" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --quiet -r requirements.txt
          # the documented install command must be the one CI uses
          grep -q "pip install -r requirements.txt" README.md

      - name: Chrome — the pinned engine (chrome_pin.py)
        id: chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce  # v1.7.3, pinned by SHA
        with:
          chrome-version: ${{ env.CHROME_VERSION }}

      - name: CHROME_PATH — one binary, and it is the pin
        run: |
          # compared against the value the action was given, not a second literal in this file
          python3 -c "import os, sys, chrome_pin; sys.exit(0 if chrome_pin.CHROME_VERSION == os.environ['CHROME_VERSION'] else 'workflow pin != chrome_pin.CHROME_VERSION — update both in one commit')"
          echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          "${{ steps.chrome.outputs.chrome-path }}" --version

      - name: Release tag must match the version the guide prints
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 -c "import sys, nav_spec as NS; t=sys.argv[1]; sys.exit(0 if t.startswith('v' + NS.GUIDE_VERSION + '.') else f'tag {t} does not start with v{NS.GUIDE_VERSION}. - bump GUIDE_VERSION in nav_spec.py and the two places in guide-v2.html')" "${{ github.ref_name }}"

      - name: Build — designed HTML -> Chrome headless -> PyMuPDF -> gate -> publish
        run: python3 build.py guide-v2.html guide-v2-ar.pdf

      - name: Gate — verify against nav_spec (explicit, same script build.py ran)
        run: python3 scripts/verify_pdf.py guide-v2-ar.pdf

      - name: Gate self-test — every mutation must be caught
        run: |
          python3 scripts/gate_selftest.py guide-v2-ar.pdf
          PDF_SPEC=nav_spec python3 scripts/artifact_inventory.py guide-v2-ar.pdf
          python3 scripts/constructs.py guide-v2-ar.pdf

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: veraPDF — the pinned distribution (URL + SHA-256, no brew)
        run: |
          set -euo pipefail
          VP_ZIP="$RUNNER_TEMP/verapdf-installer.zip"
          curl -sSL --fail --retry 3 \
            https://software.verapdf.org/releases/1.30/verapdf-greenfield-1.30.4-installer.zip \
            -o "$VP_ZIP"
          echo "$VERAPDF_INSTALLER_SHA256  $VP_ZIP" | shasum -a 256 -c -
          rm -rf "$RUNNER_TEMP/verapdf-installer" "$RUNNER_TEMP/verapdf"
          mkdir -p "$RUNNER_TEMP/verapdf-installer"
          unzip -q "$VP_ZIP" -d "$RUNNER_TEMP/verapdf-installer"
          JAR="$(find "$RUNNER_TEMP/verapdf-installer" -name 'verapdf-izpack-installer-*.jar' | head -1)"
          # Console install, CLI pack only: 1 continue · path · O create · 1 continue · N GUI · Y CLI ·
          # N docs · N samples · 1 continue · N auto-install script. The final N is the installer's question.
          printf '1\n%s\nO\n1\nN\nY\nN\nN\n1\nN\n' "$RUNNER_TEMP/verapdf" | java -jar "$JAR" -console
          echo "$RUNNER_TEMP/verapdf" >> "$GITHUB_PATH"
          # GITHUB_PATH applies to LATER steps; this step needs the absolute bin now.
          export PATH="$RUNNER_TEMP/verapdf:$PATH"
          got="$(verapdf --version 2>/dev/null | head -1 | awk '{print $2}')"
          if [ "$got" != "$VERAPDF_VERSION" ]; then
            echo "veraPDF $got is installed; the pinned distribution is $VERAPDF_VERSION — refused by name"
            exit 1
          fi
          echo "veraPDF $got — the pinned distribution"
          # 4f is the BINDING flavour for a file with attachments; plain 4 does not cover it.
          python3 scripts/verapdf_gate.py guide-v2-ar.pdf 3b ua1 4f

      - name: Second document — build and gate the report from its own spec
        run: |
          PDF_SPEC=report_spec python3 build.py report-v1.html report.pdf
          PDF_SPEC=report_spec python3 scripts/verify_pdf.py report.pdf
          PDF_SPEC=report_spec python3 scripts/gate_selftest.py report.pdf
          # 4f is the binding flavour for a file with attachments, the same rule as the guide.
          PDF_SPEC=report_spec python3 scripts/verapdf_gate.py report.pdf 3b ua1 4f
          # B8: the baseline has ONE source, the spec — a stray env override must change nothing
          VERAPDF_BASELINE=/nonexistent/baseline.toml PDF_SPEC=report_spec python3 scripts/verapdf_gate.py report.pdf 3b ua1 4f
          PDF_SPEC=report_spec python3 scripts/claim_probe.py report.pdf --check
          # the producer's furniture guard, seen failing: an unmarked body run must stop the build
          PDF_SPEC=report_spec python3 scripts/test_furniture_band.py report.pdf
          # first: every test file in the repository is named by this workflow, or excused with a reason
          python3 scripts/test_ci_wiring.py
          # the space repair is decided by a published name, not by counting draws (no engine, two pages)
          python3 scripts/test_bidi_space.py
          python3 scripts/test_verapdf_json_guard.py
          python3 scripts/test_verapdf_test_granularity.py
          python3 scripts/test_digit_value.py
          python3 scripts/test_baseline_guard.py
          python3 scripts/test_pdf_model.py
          python3 scripts/test_font_intake.py
          PDF_SPEC=report_spec python3 scripts/artifact_inventory.py report.pdf
          python3 scripts/constructs.py report.pdf
          # the tool ROADMAP cites for the responsible lines must run at this head (it broke once)
          PDF_SPEC=report_spec python3 scripts/line_order_report.py report.pdf > /dev/null

      - name: The print copy — the same document without the strip (B10)
        run: |
          # Same HTML, its own spec: no nav strip, so every strip check is n/a and the footer/ink tables are
          # its own. Its line-order floor is the tightest in the repo (measured 0.750), which is why it enters
          # CI only now that the engine is pinned (B11).
          PDF_SPEC=report_print_spec python3 build.py report-v1.html report-print.pdf
          PDF_SPEC=report_print_spec python3 scripts/verify_pdf.py report-print.pdf
          PDF_SPEC=report_print_spec python3 scripts/gate_selftest.py report-print.pdf
          # the copy declares PDF/A-3b and PDF/UA-1: a claim CI does not measure is a claim that rots
          PDF_SPEC=report_print_spec python3 scripts/verapdf_gate.py report-print.pdf 3b ua1 4f
          PDF_SPEC=report_print_spec python3 scripts/claim_probe.py report-print.pdf --check
          PDF_SPEC=report_print_spec python3 scripts/artifact_inventory.py report-print.pdf
          python3 scripts/constructs.py report-print.pdf

      - name: Text-layer parity — the new ToUnicode parser reproduces the old layer
        run: python3 scripts/test_fix_text_layer_parity.py

      - name: Claim probe — what remains if the file DECLARED conformance
        run: python3 scripts/claim_probe.py guide-v2-ar.pdf --check

      - name: Vocalised paragraphs — raw Chrome output must fail, the rebuilt text layer must copy exactly
        run: python3 scripts/test_vocalised.py

      - name: poppler, pinned to an exact conda-forge build
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pinned
          create-args: >-
            poppler=${{ env.POPPLER_VERSION }}

      - name: Conformance gate — the public corpus, every declared reader, the ratchet, and the mutations
        id: conformance
        run: |
          # poppler comes from conda-forge at an EXACT version: brew ships whatever is current, and every bump
          # would turn main red (it did — 26.10.0 → 26.11.0 between two runs an hour apart). Same source, same
          # version, locally and here, so the floors mean one thing.
          # The binary is resolved from the pinned env, not from PATH: the runner image also carries Homebrew's
          # poppler, and PATH order is not a contract.
          pdftext="$(micromamba run -n pinned sh -c 'command -v pdftotext')"
          # `export`, not $GITHUB_ENV: the latter applies to LATER steps only, and this run happens in this one
          # (measured the hard way — the gate failed with "poppler: floors recorded but the reader did not run").
          export CONFORMANCE_PDFTOTEXT="$pdftext"
          echo "CONFORMANCE_PDFTOTEXT=$pdftext" >> "$GITHUB_ENV"
          got="$("$pdftext" -v 2>&1 | sed -n 's/.*pdftotext version \([^ ]*\).*/\1/p' | head -1)"
          if [ "$got" != "$POPPLER_VERSION" ]; then
            echo "::error::poppler $got, pinned $POPPLER_VERSION — the floors belong to the pinned build"
            exit 1
          fi
          echo "poppler $got (pinned)"
          python3 -m conformance.adapters.fetch_fonts
          # Refuses a stale manifest or a category below its floor BEFORE building anything.
          python3 -m conformance manifest --check
          python3 -m conformance run --engine chrome --out /tmp/conf --ratchet
          python3 -m conformance selftest
          python3 scripts/test_check_kinds.py
          # the guards of the corpus, the metrics, the isolation, the limits, the engine-behaviour claims
          python3 conformance/tests/test_corpus.py
          python3 conformance/tests/test_metrics.py
          python3 conformance/tests/test_isolation.py
          python3 conformance/tests/test_limits.py
          python3 conformance/tests/test_certificate.py
          python3 conformance/tests/test_ratchet.py
          python3 conformance/tests/test_engine_behaviour.py
          python3 conformance/tests/test_mcid_text.py
          python3 conformance/tests/test_a3b_claim.py
          python3 conformance/tests/test_private_keys.py

      - name: Reader controls — run once, store; the check path reads them and never launches a tool
        run: python3 -m arabic_pdf_check controls --refresh

      - name: The checker — isolation, schema, thresholds, pages, privacy, reference and blind acceptance
        run: |
          # The checker is a thin layer over conformance/: these steps prove it defines no reader, no metric,
          # no normalization and no second measurement path — and that the four planted files are high with
          # their named signal while no clean file is (docs/checker-v0/).
          python3 conformance/tests/test_declared.py
          python3 conformance/tests/test_hashing.py
          python3 conformance/tests/test_lexical.py
          python3 conformance/tests/test_lcs.py
          python3 conformance/tests/test_parse_tu.py
          python3 conformance/tests/test_pdfium_close.py
          python3 conformance/tests/test_reader_isolation.py
          python3 conformance/tests/test_poppler_dash.py
          python3 arabic_pdf_check/tests/test_isolation.py
          python3 arabic_pdf_check/tests/test_fonts.py
          python3 arabic_pdf_check/tests/test_schema.py
          python3 arabic_pdf_check/tests/test_thresholds.py
          python3 arabic_pdf_check/tests/test_pages.py
          python3 arabic_pdf_check/tests/test_privacy.py
          python3 arabic_pdf_check/tests/test_reference.py
          python3 arabic_pdf_check/tests/test_controls.py
          python3 arabic_pdf_check/tests/test_refusals.py
          python3 arabic_pdf_check/tests/test_packaging.py
          python3 arabic_pdf_check/tests/test_blind.py
          python3 arabic_pdf_check/tests/test_lam_alef_signal.py
          python3 arabic_pdf_check/tests/test_segment_order.py
          python3 scripts/build_wiki_lexicon.py --verify-source
          python3 scripts/test_build_wiki_lexicon.py
          python3 scripts/test_lexicon_compare.py
          python3 scripts/test_calibration.py
          python3 scripts/test_no_owner_names.py --self-test

      - name: Foreign producer set — LibreOffice output, measured by the checker
        run: |
          # A clean set from a DIFFERENT producer: an alarm here is a calibration failure, not a file failure.
          SOFFICE="/Applications/LibreOffice.app/Contents/MacOS/soffice"
          if [ ! -x "$SOFFICE" ]; then brew install --cask libreoffice; fi
          mkdir -p "$RUNNER_TEMP/foreign-set"
          "$SOFFICE" --headless --convert-to pdf --outdir "$RUNNER_TEMP/foreign-set" \
            docs/checker-v0/foreign/lo-arabic-body.html docs/checker-v0/foreign/lo-arabic-table.html
          python3 scripts/checker_foreign.py "$RUNNER_TEMP/foreign-set" --out "$RUNNER_TEMP/foreign.json"

      - name: The checker — measure the planted and clean sets (the acceptance numbers, produced here)
        run: |
          # The acceptance numbers are PRODUCED here, not trusted from a committed file: the four planted
          # files must be high with their named signal, and no clean file may be high. --skip-owner: the
          # owner's corpus is not on this machine and is never downloaded, never deposited.
          python3 scripts/checker_measure.py --skip-owner --tolerance 0.05 --out /tmp/checker-measure

      - name: Upload the checker measurement (the environment's raw thresholds)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: checker-measure
          path: /tmp/checker-measure

      # The run's raw numbers are what a floors acceptance is made from: a version with no floors fails the
      # step above, and this artifact is the input to `conformance ratchet accept --from results.json`.
      - name: Upload the conformance run
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: conformance-results
          path: /tmp/conf/results.json
          if-no-files-found: warn

      - name: Upload partial on failure (for inspection)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: guide-v2-partial
          path: guide-v2-ar.partial.pdf
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: guide-v2-pdf
          path: guide-v2-ar.pdf
          if-no-files-found: error

  checker-linux:
    # The checker on a Linux machine: four readers (PDFKit is macOS-only and must be declared missing), the
    # same file, and no conformance ratchet. This job's poppler is the distribution's UNPINNED build — it is a
    # smoke run of the checker, not the conformance floors (those pin 26.11.0 and refuse other builds; the
    # floor job is macOS). The distinction is deliberate and named here.
    runs-on: ubuntu-latest
    env:
      CHROME_VERSION: "157.0.8103.78"
    steps:
      - uses: actions/checkout@v5
      - name: One cache root for the run (the checker reads stored controls)
        run: echo "ARABIC_PDF_CHECK_CACHE=$RUNNER_TEMP/arabic-pdf-check" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python3 -m pip install --quiet -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Chrome for Testing — the pinned engine (the same CfT build as macOS, not a Chromium snapshot)
        run: |
          set -euo pipefail
          Z="$RUNNER_TEMP/chrome-linux64.zip"
          curl -sSL --fail --retry 3 \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chrome-linux64.zip" \
            -o "$Z"
          unzip -q "$Z" -d "$RUNNER_TEMP"
          echo "CHROME_PATH=$RUNNER_TEMP/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - name: Fonts and reader controls
        run: |
          python3 -m conformance.adapters.fetch_fonts
          python3 -m arabic_pdf_check controls --refresh
      - name: Checker unit tests on Linux
        run: |
          python3 conformance/tests/test_hashing.py
          python3 conformance/tests/test_lexical.py
          python3 conformance/tests/test_lcs.py
          python3 conformance/tests/test_parse_tu.py
          python3 conformance/tests/test_pdfium_close.py
          python3 conformance/tests/test_reader_isolation.py
          python3 conformance/tests/test_poppler_dash.py
          python3 arabic_pdf_check/tests/test_pages.py
          python3 arabic_pdf_check/tests/test_controls.py
          python3 arabic_pdf_check/tests/test_lam_alef_signal.py
          python3 arabic_pdf_check/tests/test_segment_order.py
          python3 arabic_pdf_check/tests/test_packaging.py
          python3 scripts/test_build_wiki_lexicon.py
          python3 scripts/test_lexicon_compare.py
          python3 scripts/test_calibration.py
          python3 scripts/test_no_owner_names.py --self-test
          python3 scripts/test_ci_wiring.py
      - name: The checker with four Linux readers
        run: |
          python3 - <<'PY'
          import json
          import os
          import tempfile
          import fitz
          from arabic_pdf_check import blind
          # A clean LATIN file: the Arabic blind-acceptance set is the macOS job's, and this job's claim is the
          # four-reader matrix on Linux (Chrome's Arabic fixture crashed a Chromium snapshot; the CfT control
          # above still proves the browser works). A Latin layer triggers no Arabic signal and keeps the file low.
          pdf = os.path.join(tempfile.mkdtemp(prefix="linux-check-"), "clean-latn.pdf")
          doc = fitz.open()
          page = doc.new_page()
          page.insert_text((72, 72), "Invoice 2026-11-24  Total 1,234.56 SAR  Thank you for your business.",
                           fontname="helv", fontsize=12)
          doc.save(pdf)
          doc.close()
          thresholds = json.load(open("arabic_pdf_check/thresholds.json", encoding="utf-8"))
          report = blind.check(pdf, thresholds)
          expected = {"pdfium", "mupdf", "poppler", "pdfminer"}
          assert set(report["readers"]) == expected, report["readers"]
          assert "pdfkit" in report["missing_readers"], report["missing_readers"]
          assert report["risk"]["file"]["level"] != "high", report["risk"]["file"]
          print("readers:", ", ".join(sorted(report["readers"])), "· file:",
                report["risk"]["file"]["level"], "· pdfkit:", report["missing_readers"]["pdfkit"])
          PY

  release:
    # the only job with write access: publishes the file the build job has just gated
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: guide-v2-pdf

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Up to 3 tries, idempotent: a 5xx from the API can arrive after the release was created,
        # so each retry first checks whether it exists and then only (re)uploads the asset.
        run: |
          TAG="${{ github.ref_name }}"
          for i in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" guide-v2-ar.pdf --clobber && exit 0
            else
              gh release create "$TAG" guide-v2-ar.pdf --generate-notes && exit 0
            fi
            echo "attempt $i failed; retrying in $((i * 20))s"; sleep $((i * 20))
          done
          exit 1
