name: Build PDF

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS: same system faces as the owner's Mac (GeezaPro for the vocalised basmala) and Chrome preinstalled
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install --quiet "pymupdf>=1.24,<2" "segno>=1.6" "pillow>=10" "pikepdf>=9" "fonttools>=4.40" "pypdfium2>=4.30"

      - name: Build — designed HTML -> Chrome headless -> PyMuPDF -> gate -> publish
        run: python3 build.py guide-v2.html guide-v2-ar.pdf

      - name: Gate — verify against nav_spec (explicit, same script build.py ran)
        run: python3 scripts/verify_pdf.py guide-v2-ar.pdf

      - name: Gate self-test — every mutation must be caught
        run: python3 scripts/gate_selftest.py guide-v2-ar.pdf

      - name: Vocalised paragraphs — raw Chrome output must fail, the rebuilt text layer must copy exactly
        run: python3 scripts/test_vocalised.py

      - name: Upload partial on failure (for inspection)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: guide-v2-partial
          path: guide-v2-ar.partial.pdf
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: guide-v2-pdf
          path: guide-v2-ar.pdf
          if-no-files-found: error

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # Up to 3 tries, idempotent: a 5xx from the API can arrive after the release was created,
        # so each retry first checks whether it exists and then only (re)uploads the asset.
        run: |
          TAG="${{ github.ref_name }}"
          for i in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" guide-v2-ar.pdf --clobber && exit 0
            else
              gh release create "$TAG" guide-v2-ar.pdf --generate-notes && exit 0
            fi
            echo "attempt $i failed; retrying in $((i * 20))s"; sleep $((i * 20))
          done
          exit 1
