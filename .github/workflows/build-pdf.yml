name: Build PDF

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Building needs to read the repository, nothing more; only the release job may write (and only on a version tag).
permissions:
  contents: read

jobs:
  build:
    # macOS: same system faces as the owner's Mac (GeezaPro for the vocalised basmala) and Chrome preinstalled
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --quiet -r requirements.txt
          # the documented install command must be the one CI uses
          grep -q "pip install -r requirements.txt" README.md

      - name: Release tag must match the version the guide prints
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 -c "import sys, nav_spec as NS; t=sys.argv[1]; sys.exit(0 if t.startswith('v' + NS.GUIDE_VERSION + '.') else f'tag {t} does not start with v{NS.GUIDE_VERSION}. - bump GUIDE_VERSION in nav_spec.py and the two places in guide-v2.html')" "${{ github.ref_name }}"

      - name: Build — designed HTML -> Chrome headless -> PyMuPDF -> gate -> publish
        run: python3 build.py guide-v2.html guide-v2-ar.pdf

      - name: Gate — verify against nav_spec (explicit, same script build.py ran)
        run: python3 scripts/verify_pdf.py guide-v2-ar.pdf

      - name: Gate self-test — every mutation must be caught
        run: python3 scripts/gate_selftest.py guide-v2-ar.pdf

      - name: Vocalised paragraphs — raw Chrome output must fail, the rebuilt text layer must copy exactly
        run: python3 scripts/test_vocalised.py

      - name: Upload partial on failure (for inspection)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: guide-v2-partial
          path: guide-v2-ar.partial.pdf
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: guide-v2-pdf
          path: guide-v2-ar.pdf
          if-no-files-found: error

  release:
    # the only job with write access: publishes the file the build job has just gated
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: guide-v2-pdf

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Up to 3 tries, idempotent: a 5xx from the API can arrive after the release was created,
        # so each retry first checks whether it exists and then only (re)uploads the asset.
        run: |
          TAG="${{ github.ref_name }}"
          for i in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" guide-v2-ar.pdf --clobber && exit 0
            else
              gh release create "$TAG" guide-v2-ar.pdf --generate-notes && exit 0
            fi
            echo "attempt $i failed; retrying in $((i * 20))s"; sleep $((i * 20))
          done
          exit 1
