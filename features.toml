# Declared feature list — order, profile and stage. The build reads this; the gate verifies against it.
# OWNER DECISION (2026-11-14): AES-256 and PAdES are EXCLUDED from the plan and the work.
# They are not "deferred": no stage-9/stage-10 feature is declared, and profiles secure/signed do not exist.
# PDF/A forbids encryption anyway, so the exclusion is consistent with the archive profile.
# stage 3 = interactivity, 5 = metadata/structure (no drawing), 9 = encryption, 10 = signature.
#
# DEVIATION FROM THE FEATURE SPEC (declared, not hidden): the spec assigns attachments to `archive` and
# OutputIntent to `print`. All three profiles this build can produce (web/print/archive) carry the same five
# stage-5 features, because the gate is not yet profile-aware and a file that silently omits a declared
# feature would fail a correct build. `secure` and `signed` are NOT implemented and are refused by name in
# postprocess.py. Closing condition: stamp the profile in Info, make the gate read it, then split per profile.
[features.page-labels]
stage = 5
profiles = ["web", "print", "archive"]

[features.named-destinations]
stage = 5
profiles = ["web", "print", "archive"]

[features.xmp]
stage = 5
profiles = ["web", "print", "archive"]

[features.output-intent]
stage = 5
profiles = ["web", "print", "archive"]

[features.attachments]
stage = 5
profiles = ["web", "print", "archive"]

[features.acroform]
stage = 5
profiles = ["web", "print", "archive"]
