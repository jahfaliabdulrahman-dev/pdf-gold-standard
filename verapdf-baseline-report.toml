# veraPDF baseline for «الحرف المقلوب» (report-v1.html), measured with its own build.
# 3b is EMPTY: the file declares PDF/A-3b, and the gate refuses a claim whose baseline lists a failure.
# ua1 is EMPTY too: the file declares PDF/UA-1, and the gate refuses a claim whose baseline lists a failure.
# failing = clause-testNumber (e.g. 6.6.4-1), derived by scripts/verapdf_baseline.py --write.
# fixed.rules and regressions.open stay at clause level: a rule that stopped failing cannot be
# re-measured for its test number, so those historical lists are compared by clause.
version = "1.30.0"
revalidated_on = "1.30.4"
revalidated_sha256 = "04415ef3f149526a3048b9889723e81320ddf013bd891bcc7f0f297f3eadcc23"
measured_on = "report.pdf (17 pages, declared PDF/A-3b + PDF/UA-1)"
flavours = ["3b", "ua1", "4f"]

[3b]
failing = []

[ua1]
failing = []   # PDF/UA-1 claimed, so this MUST be empty

[4f]
# Measured 2026-11-17 (veraPDF 1.30.0): the binding flavour for a file with attachments. The three
# clauses are the header rule (6.1.2), two Info-dictionary rules (6.1.3 tests 4 and 5), and the
# identification values (6.7.3 tests 2, 3, 5: part, conformance, rev — the file declares 3b, not 4f).
# Anything NEW here is a regression.
failing = ["6.1.2-1", "6.1.3-4", "6.1.3-5", "6.7.3-2", "6.7.3-3", "6.7.3-5"]
