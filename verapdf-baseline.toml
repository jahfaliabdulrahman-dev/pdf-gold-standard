# veraPDF baseline — every failing rule is NAMED here with its reason and its closing condition.
# The gate fails on: a rule that fails and is not listed (new defect), and a listed rule that stopped
# failing (dead exception = stale claim). Rule ids are clause numbers, copied from veraPDF 1.30.0 JSON.
version = "1.30.0"
measured_on = "80a8c8d"
flavours = ["3b", "ua1", "4"]

[3b]
# 6.6.4 / 6.7.3: Info and XMP are not synchronised (XMP pdf:Producer is pikepdf, Info carries the pipeline).
# Closes when postprocess writes one value to both (load_from_docinfo or mirrored fields) and the rule passes.
failing = ["6.2.11.5", "6.3.2", "6.3.3", "6.4.1", "6.6.2.3.1", "6.6.4"]

[ua1]
# 7.18.x / 7.4.2: structure-level defects (link annotations lack /Contents+OBJR, tables without headers).
# 7.21.5: glyph width conformance. Closes when the named structure work is done and veraPDF agrees.
failing = ["7.1", "7.18.1", "7.18.4", "7.18.5", "7.21.5", "7.4.2"]

[4]
# 6.1.2/6.1.3: header/version claims. 6.9: OCProperties configuration. 6.7.3: Info<->XMP sync.
failing = ["6.1.2", "6.1.3", "6.2.10.5", "6.3.2", "6.3.3", "6.4.1", "6.7.3", "6.9"]

