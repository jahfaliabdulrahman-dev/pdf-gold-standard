# veraPDF baseline, classified by the rule's OWN description (read from JSON, not guessed).
# 3b 6.6.4 / 4 6.7.3 / ua1 5 are IDENTIFICATION rules: they must fail while the file declares nothing,
# and the claim probe (scripts/claim_probe.py) measures what would remain if it did.
# 4 6.9-3 = "All of the embedded files shall be compliant with ISO 19005-1/2/4": OUR attachments vs PDF/A-4.
version = "1.30.0"
# measured_on explains the base: at 08e921f the file had NO XMP, so 6.6.2.1/6.7.2.1 failed
# (metadata absent). With XMP the same defect reports as 6.6.4/6.7.3 (identification absent):
# a rule SUBSTITUTION, not a regression. Base set and fixed/regression lists are unchanged.
measured_on = "8152d99"
# 4f is the binding flavour (owner decision 2026-11-14): PDF/A-4 with arbitrary embedded files.
# 4 is still measured in the report as a follow-up line, NOT as a gate: it can never pass while the
# file carries non-PDF/A attachments, and that conflict is resolved by 4f, not by deleting evidence.
flavours = ["3b", "ua1", "4f"]

# CLASSIFICATION (documentation only — enforced by the claim probe, see below):
#   3b 6.6.4 / 4 6.7.3 / ua1 5 = identification rules: they fail while the file declares nothing.
#   scripts/claim_probe.py injects the identifiers into a COPY and measures what remains.
[3b]
failing = ["6.6.4"]
[fixed.3b]
rules = ["6.2.10", "6.2.4.3", "6.2.11.5", "6.3.2", "6.3.3", "6.4.1", "6.6.2.1", "6.6.2.3.1"]

[ua1]
failing = ["5", "7.1", "7.18.1", "7.18.5", "7.21.5", "7.4.2"]
[fixed.ua1]
rules = []          # 7.18.4 was a REGRESSION this branch closed (see commit 8152d99)

[4]
failing = ["6.1.2", "6.1.3", "6.2.10.5", "6.7.3", "6.9"]
[fixed.4]
rules = ["6.2.4.3", "6.2.9", "6.3.2", "6.3.3", "6.4.1", "6.7.2.1"]


[4f]
failing = ["6.1.2", "6.1.3", "6.2.10.5", "6.7.3"]   # measured; 6.7.3 = identification
