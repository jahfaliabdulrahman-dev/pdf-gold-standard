[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-pdf-check"
version = "0.1.0"
description = "Where does Arabic copy-paste break in a PDF, and in which reader? A thin layer over conformance/."
readme = "arabic_pdf_check/README.md"
requires-python = ">=3.11"
# The code is MIT; the word list under conformance/data is CC-BY-SA-4.0 (it keeps its own notice, and the
# notice is shipped inside the wheel). The aggregate is therefore the conjunction, not MIT alone.
license = "MIT AND CC-BY-SA-4.0"
license-files = ["LICENSE", "conformance/data/LICENSE-ar_words.txt"]
# The dependency list is requirements.txt, one file, the one CI installs. `test_packaging.py` parses both and
# checks that requirements == dependencies ∪ every declared extra — so the two cannot become two truths without a
# red test, and an extra cannot be shipped by accident.
dependencies = [
    "pypdfium2==5.15.2",
    "pikepdf==10.18.1",
    "pillow==13.0.0",
    "segno==1.6.6",
    "fonttools==4.68.0",
    "pdfplumber==0.11.10",
    "pdfminer.six==20260107",
    "jsonschema==4.26.0",
    "arafix==1.2.0",
]

[project.optional-dependencies]
# PyMuPDF is AGPLv3-or-commercial (pymupdf.io/licensing). It renders the `mupdf` reader and the producer
# (`build.py`, the fixture writer, the MuPDF controls) needs it, but the SHIPPED checker must install and run
# without it: a customer who never installed it is never running AGPL code, and the report names the reader as
# unavailable with this extra's install line. `pip install '.[mupdf]'` is what CI and the producer use.
mupdf = ["pymupdf==2.1"]

[project.scripts]
arabic-pdf-check = "arabic_pdf_check.cli:main"

[tool.setuptools]
# `conformance.mcid_text` imports `scripts/fix_text_layer.py` through sys.path, and `conformance.checks.structure`
# imports `pdfops` from the repository root: the tool runs from a CHECKOUT (`pip install -e .`), which is what
# the README documents. A wheel from this tree would need those two paths re-thought — out of scope for v0.
py-modules = ["pdfops"]

[tool.setuptools.packages.find]
include = ["arabic_pdf_check*", "conformance*"]

[tool.setuptools.package-data]
arabic_pdf_check = ["thresholds.json", "schema/*.json"]
conformance = ["ratchet.json", "corpus/MANIFEST.json", "corpus/cases/*.json", "schema/*.json",
               "readers/*.json", "data/*.gz", "data/LICENSE-*"]
