# veraPDF baseline for «نجد» (najd.html), measured with its own build.
# failing = clause-testNumber (e.g. 6.6.4-1), derived by scripts/verapdf_baseline.py --write.
# fixed.rules and regressions.open stay at clause level: a rule that stopped failing cannot be
# re-measured for its test number, so those historical lists are compared by clause.
version = "1.30.0"
measured_on = "najd.pdf (11 pages, declared PDF/A-3b + PDF/UA-1)"
flavours = ["3b", "ua1"]

[3b]
failing = []   # نجد يعلن PDF/A-3b، فمجموعة الفشل يجب أن تبقى فارغة

[ua1]
failing = []   # نجد يعلن PDF/UA-1، فمجموعة الفشل يجب أن تبقى فارغة
